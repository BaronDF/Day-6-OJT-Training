
# PostgreSQL configuration

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: 127.0.0.1

development:
  <<: *default
  database: first_rails_app_development

test:
  <<: *default
  database: first_rails_app_test

production:
  primary:
    <<: *default
    database: first_rails_app_production
    username: first_rails_app
    password: <%= ENV["FIRST_RAILS_APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: first_rails_app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: first_rails_app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: first_rails_app_production_cable
    migrations_paths: db/cable_migrate
